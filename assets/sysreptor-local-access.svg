<style>text{font-family:'Fragment Mono',monospace;fill:#dedede}.heading{font-size:22px;font-weight:bold}.node{font-size:18px;fill:#a1c9bb;font-weight:bold}.detail{font-size:15px}.label{font-size:13px;fill:#aaa}.box{fill:#171c1a;stroke:#608d7f}.edge{fill:none;stroke:#779fc2;stroke-width:2;marker-end:url(#arrow)}.boundary{fill:#111;stroke:#444}</style>
<rect width="900" height="440" fill="#0e0e0e"/><text class="heading" x="30" y="40">SysReptor · local access</text>
<rect class="boundary" x="30" y="70" width="840" height="340" rx="6"/><text class="label" x="50" y="96">LOCAL MACHINE</text><rect class="box" x="50" y="120" width="800" height="80" rx="5"/><text class="node" x="70" y="150">Hosts file</text><text class="detail" x="70" y="176">sysreptor.brogano.dev → local loopback address</text><rect class="box" x="50" y="275" width="210" height="100" rx="5"/><text class="node" x="70" y="305">Browser</text><text class="detail" x="70" y="331">Local hostname</text><rect class="box" x="335" y="275" width="230" height="100" rx="5"/><text class="node" x="355" y="305">Nginx</text><text class="detail" x="355" y="331">Dedicated Docker</text><text class="detail" x="355" y="354">reverse proxy</text><rect class="box" x="640" y="275" width="210" height="100" rx="5"/><text class="node" x="660" y="305">SysReptor</text><text class="detail" x="660" y="331">Local application</text><path class="edge" d="M255 200V236H155V268"/><text class="label" x="275" y="237">Name resolution</text><path class="edge" d="M260 325H328"/><path class="edge" d="M565 325H633"/>
