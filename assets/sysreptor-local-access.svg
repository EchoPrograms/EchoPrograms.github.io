<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">SysReptor · local access</title><desc id="desc">The hosts file resolves sysreptor.brogano.dev to the local machine. A browser connects to the dedicated Nginx Docker container, which forwards requests to SysReptor.</desc>
