<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">OpenMediaVault · disk passthrough</title><desc id="desc">A physical disk attached to a Proxmox host is passed through to the OpenMediaVault QEMU virtual machine using a stable device identifier.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#779fc2" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Fragment Mono',monospace;fill:#dedede}.heading{font-size:22px;font-weight:bold}.node{font-size:18px;fill:#a1c9bb;font-weight:bold}.detail{font-size:15px}.label{font-size:13px;fill:#aaa}.box{fill:#171c1a;stroke:#608d7f}.edge{fill:none;stroke:#779fc2;stroke-width:2;marker-end:url(#arrow)}.boundary{fill:#111;stroke:#444}</style>
<rect width="900" height="400" fill="#0e0e0e"/><text class="heading" x="30" y="40">OpenMediaVault · disk passthrough</text>
<rect class="boundary" x="30" y="80" width="840" height="280" rx="6"/><text class="label" x="50" y="110">PROXMOX HOST</text><rect class="box" x="50" y="150" width="285" height="100" rx="5"/><text class="node" x="70" y="180">Physical disk</text><text class="detail" x="70" y="206">Stable device identifier</text><rect class="box" x="520" y="150" width="330" height="100" rx="5"/><text class="node" x="540" y="180">OpenMediaVault</text><text class="detail" x="540" y="206">QEMU virtual machine</text><path class="edge" d="M335 200H513"/><text class="label" x="355" y="185">Disk passthrough</text><text class="detail" x="50" y="306">The guest accesses the disk attached to this host.</text><text class="label" x="50" y="335">Storage availability depends on both the host and the NAS VM.</text>
</svg>
