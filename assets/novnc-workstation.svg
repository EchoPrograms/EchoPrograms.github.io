<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">noVNC local CTF workstation connection</title>
  <desc id="desc">A Tailnet browser reaches noVNC, websockify, a VNC server and a Linux workstation running CTF tools.</desc>
  <style>
    text { font-family: 'Fragment Mono', monospace; fill: #d9e4df; }
    .small { font-size: 15px; fill: #9bb0a8; }
    .label { font-size: 16px; }
    .box { fill: #15201d; stroke: #78a99a; stroke-width: 2; }
    .inner { fill: #101714; stroke: #4f7568; stroke-width: 1.5; }
    .line { stroke: #a1c9bb; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a1c9bb"/></marker></defs>
  <rect width="900" height="430" fill="#0a0f0d"/>
  <text x="40" y="42" class="label">pwnbox.brogano.dev · local Tailnet path</text>
  <text x="40" y="68" class="small">Browser access to a reusable CTF workstation</text>
  <rect x="40" y="110" width="240" height="92" rx="5" class="box"/>
  <text x="160" y="146" text-anchor="middle" class="label">Tailnet browser</text>
  <text x="160" y="176" text-anchor="middle" class="small">HTTPS / WebSocket</text>
  <rect x="330" y="110" width="240" height="92" rx="5" class="box"/>
  <text x="450" y="146" text-anchor="middle" class="label">noVNC</text>
  <text x="450" y="176" text-anchor="middle" class="small">browser VNC client</text>
  <rect x="620" y="110" width="240" height="92" rx="5" class="box"/>
  <text x="740" y="146" text-anchor="middle" class="label">websockify</text>
  <text x="740" y="176" text-anchor="middle" class="small">WebSocket bridge</text>
  <path d="M280 156H330" class="line"/>
  <path d="M570 156H620" class="line"/>
  <rect x="140" y="270" width="620" height="130" rx="7" class="inner"/>
  <rect x="170" y="300" width="210" height="56" rx="4" class="box"/>
  <text x="275" y="334" text-anchor="middle" class="label">VNC server</text>
  <rect x="430" y="300" width="300" height="56" rx="4" class="box"/>
  <text x="580" y="334" text-anchor="middle" class="label">Linux desktop + tools</text>
  <text x="450" y="383" text-anchor="middle" class="small">LOCAL DOCKER WORKSTATION</text>
  <path d="M740 202V240H275V300" class="line"/>
  <path d="M380 328H430" class="line"/>
</svg>
