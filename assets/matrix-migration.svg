<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Matrix · service migration</title><desc id="desc">The service moved from remote hosting to local infrastructure, preserving application data, configuration, and signing keys. The local service includes Synapse and Element.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#779fc2" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Fragment Mono',monospace;fill:#dedede}.heading{font-size:22px;font-weight:bold}.node{font-size:18px;fill:#a1c9bb;font-weight:bold}.detail{font-size:15px}.label{font-size:13px;fill:#aaa}.box{fill:#171c1a;stroke:#608d7f}.edge{fill:none;stroke:#779fc2;stroke-width:2;marker-end:url(#arrow)}.boundary{fill:#111;stroke:#444}</style>
<rect width="900" height="460" fill="#0e0e0e"/><text class="heading" x="30" y="40">Matrix · service migration</text>
<rect class="box" x="30" y="90" width="260" height="100" rx="5"/><text class="node" x="50" y="120">Remote host</text><text class="detail" x="50" y="146">Previous deployment</text><rect class="box" x="530" y="90" width="340" height="100" rx="5"/><text class="node" x="550" y="120">Local infrastructure</text><text class="detail" x="550" y="146">Synapse + Element</text><path class="edge" d="M290 140H523"/><text class="label" x="350" y="123">Migration</text><rect class="boundary" x="30" y="235" width="840" height="190" rx="6"/><text class="label" x="50" y="265">PRESERVED DURING THE MOVE</text><rect class="box" x="50" y="287" width="245" height="100" rx="5"/><text class="node" x="70" y="317">Application data</text><text class="detail" x="70" y="343">Stored service state</text><rect class="box" x="327" y="287" width="245" height="100" rx="5"/><text class="node" x="347" y="317">Configuration</text><text class="detail" x="347" y="343">Application settings</text><rect class="box" x="604" y="287" width="245" height="100" rx="5"/><text class="node" x="624" y="317">Signing keys</text><text class="detail" x="624" y="343">Server identity</text>
