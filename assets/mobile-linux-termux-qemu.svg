<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Mobile Linux virtualization and Portainer management</title>
  <desc id="desc">An Android phone runs Termux and QEMU with a Linux virtual machine. A Portainer Agent connects over Tailscale to the main Portainer instance.</desc>
  <style>
    text { font-family: 'Fragment Mono', monospace; fill: #d9e4df; }
    .small { font-size: 15px; fill: #9bb0a8; }
    .label { font-size: 17px; }
    .box { fill: #15201d; stroke: #78a99a; stroke-width: 2; }
    .inner { fill: #101714; stroke: #4f7568; stroke-width: 1.5; }
    .line { stroke: #a1c9bb; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a1c9bb"/></marker></defs>
  <rect width="900" height="430" fill="#0a0f0d"/>
  <text x="40" y="42" class="label">Android Linux virtualization · private management path</text>
  <text x="40" y="68" class="small">Termux and QEMU on the phone, Portainer over Tailscale</text>
  <rect x="40" y="100" width="350" height="290" rx="8" class="box"/>
  <text x="215" y="133" text-anchor="middle" class="label">Android phone</text>
  <rect x="55" y="153" width="320" height="222" rx="5" class="inner"/>
  <text x="215" y="180" text-anchor="middle" class="label">Termux + QEMU</text>
  <text x="215" y="204" text-anchor="middle" class="small">ARM / x86 guests</text>
  <rect x="65" y="239" width="300" height="126" rx="5" class="inner"/>
  <text x="215" y="264" text-anchor="middle" class="label">Linux VM</text>
  <text x="215" y="286" text-anchor="middle" class="small">Virtual disks · networking</text>
  <rect x="85" y="307" width="260" height="40" rx="4" class="box"/>
  <text x="215" y="333" text-anchor="middle" class="label">Portainer Agent</text>
  <rect x="570" y="239" width="290" height="126" rx="8" class="box"/>
  <text x="715" y="272" text-anchor="middle" class="small">Existing infrastructure</text>
  <rect x="590" y="307" width="250" height="40" rx="4" class="inner"/>
  <text x="715" y="333" text-anchor="middle" class="label">Main Portainer</text>
  <path d="M345 327H590" class="line"/>
  <text x="480" y="309" text-anchor="middle" class="small">Tailscale</text>
</svg>
