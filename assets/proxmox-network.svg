<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
  <title id="title">Homelab access paths</title>
  <desc id="desc">Public visitors reach selected web applications through Cloudflare and separate cloudflared connectors in the homelab and cloud VM. Private administration uses Tailscale to reach the local environment and the separate cloud VM. These are logical access paths, not physical links.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#779fc2" stroke-width="1.5"/></marker></defs>
  <style>text{font-family:'Fragment Mono',monospace;fill:#dedede;font-size:16px}.heading{font-size:21px;font-weight:bold}.label{font-size:13px;fill:#aaa}.box{fill:#171c1a;stroke:#608d7f}.boundary{fill:#111;stroke:#333}.public{fill:none;stroke:#779fc2;stroke-width:2;marker-end:url(#arrow)}.private{fill:none;stroke:#8abeb0;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="900" height="610" fill="#0e0e0e"/>
  <text x="30" y="39" class="heading">Network access</text>
  <text x="30" y="64" class="label">Logical paths · documentation snapshot: August 2026</text>
  <rect class="boundary" x="30" y="87" width="840" height="258" rx="6"/>
  <text x="50" y="114" class="label">PUBLIC WEB APPLICATIONS</text>
  <g class="public"><path d="M211 216H260"/><path d="M445 216H492V167H535"/><path d="M492 216V279H535"/><path d="M712 167H745"/><path d="M712 279H745"/></g>
  <rect class="box" x="50" y="185" width="161" height="62" rx="4"/>
  <text x="130" y="221" text-anchor="middle">Visitors</text>
  <rect class="box" x="260" y="185" width="185" height="62" rx="4"/>
  <text x="352" y="221" text-anchor="middle">Cloudflare</text>
  <text x="535" y="130" class="label">LOCAL HOMELAB</text>
  <rect class="box" x="535" y="143" width="177" height="48" rx="4"/>
  <text x="623" y="173" text-anchor="middle">cloudflared</text>
  <rect class="box" x="745" y="143" width="105" height="48" rx="4"/>
  <text x="797" y="173" text-anchor="middle">Web apps</text>
  <text x="535" y="242" class="label">CLOUD · arminstance</text>
  <rect class="box" x="535" y="255" width="177" height="48" rx="4"/>
  <text x="623" y="285" text-anchor="middle">cloudflared</text>
  <rect class="box" x="745" y="255" width="105" height="48" rx="4"/>
  <text x="797" y="285" text-anchor="middle">Web apps</text>
  <rect class="boundary" x="30" y="365" width="840" height="198" rx="6"/>
  <text x="50" y="392" class="label">PRIVATE ADMINISTRATION</text>
  <path class="private" d="M211 473H260M445 473H492V430H535M492 473V516H535"/>
  <rect class="box" x="50" y="442" width="161" height="62" rx="4"/>
  <text x="130" y="478" text-anchor="middle">Admin devices</text>
  <rect class="box" x="260" y="442" width="185" height="62" rx="4"/>
  <text x="352" y="468" text-anchor="middle">Tailscale</text>
  <text x="352" y="489" text-anchor="middle" class="label">Private overlay</text>
  <rect class="box" x="535" y="409" width="315" height="43" rx="4"/>
  <text x="692" y="436" text-anchor="middle">Local homelab management</text>
  <rect class="box" x="535" y="495" width="315" height="43" rx="4"/>
  <text x="692" y="522" text-anchor="middle">arminstance management</text>
  <text x="30" y="590" class="label">Public paths show selected web routes only; the cloud VM is outside the Proxmox cluster.</text>
</svg>
