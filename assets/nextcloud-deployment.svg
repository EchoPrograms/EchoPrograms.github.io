<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Nextcloud deployment path</title><desc id="desc">A selected hostname reaches Cloudflare Tunnel, which forwards to Nextcloud on a local Linux virtual machine.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#779fc2" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Fragment Mono',monospace;fill:#dedede}.heading{font-size:22px;font-weight:bold}.node{font-size:18px;fill:#a1c9bb;font-weight:bold}.detail{font-size:15px}.label{font-size:13px;fill:#aaa}.box{fill:#171c1a;stroke:#608d7f}.boundary{fill:#111;stroke:#444}.edge{fill:none;stroke:#779fc2;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="900" height="430" fill="#0e0e0e"/><text class="heading" x="30" y="40">Nextcloud · deployment path</text><text class="label" x="30" y="66">Local hosting with a Cloudflare Tunnel route</text>
<rect class="box" x="30" y="115" width="200" height="90" rx="5"/><text class="node" x="50" y="151">Hostname</text><text class="detail" x="50" y="179">Nextcloud domain</text>
<rect class="box" x="350" y="115" width="200" height="90" rx="5"/><text class="node" x="370" y="145">Cloudflare</text><text class="node" x="370" y="169">Tunnel</text><text class="detail" x="370" y="193">Selected route</text>
<rect class="box" x="670" y="115" width="200" height="90" rx="5"/><text class="node" x="690" y="151">Nextcloud</text><text class="detail" x="690" y="179">Local application</text>
<path class="edge" d="M230 160H340"/><path class="edge" d="M550 160H660"/><text class="label" x="267" y="146">HTTPS</text><text class="label" x="580" y="146">Forward</text>
<rect class="boundary" x="30" y="260" width="840" height="115" rx="5"/><text class="label" x="50" y="288">LOCAL LINUX HOST</text><rect class="box" x="50" y="305" width="350" height="50" rx="4"/><text class="node" x="70" y="337">Nextcloud virtual machine</text><rect class="box" x="490" y="305" width="350" height="50" rx="4"/><text class="detail" x="510" y="337">Application data and file previews</text><path class="edge" d="M770 205V250H225V295"/>
</svg>
