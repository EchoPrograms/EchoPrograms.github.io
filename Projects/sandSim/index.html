<html>
	<head>
		<meta charset="utf-8">
		<title>SandFall</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="../../assets/demo.css">
	</head>
	<body>
		<header class="demo-header"><a href="../../portfolio/">← Back to projects</a><h1>Sand game</h1></header>
		<main id="sand-workspace" class="demo-workspace" tabindex="0" aria-label="Sand game controls and canvas; scroll to explore">
	
		
		<button onclick="r=255;b=0;g=0">red</button>
		<button onclick="r=255;b=0;g=111">orange</button>
		<button onclick="r=255;b=0;g=255">yellow</button>
		<button onclick="r=0;b=0;g=255">green</button>
		<button onclick="r=0;b=255;g=0">blue</button>
		<button onclick="r=170;b=255;g=0">purple</button>
		<button onclick="r=0;b=0;g=0">black</button>
		<button onclick="r=255;b=255;g=255">eraser</button>
		<span></span>
		<button onclick="shrinkRadius()">-</button><span id="size"> 4 </span><button onclick="growRadius()">+</button>
		<p id="paused">Not Paused</p>
		<script src="p5.min.js"></script>
		<script src="./script.js"></script>
		</main>
	</body>
</html>
